/**
 * It is advised that you do not edit anything in the build.gradle; unless you are sure of what you are doing
 */
plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
}

// 读取 gradle.properties 中的值
def modVersion = project.findProperty('mod_version') ?: '1.0.0'
def rootPackage = project.findProperty('root_package') ?: 'com.example'
def modId = project.findProperty('mod_id') ?: 'examplemod'

version = modVersion
group = rootPackage

base {
    archivesName.set(modId)
}

java {
    if (!project.hasProperty('generate_sources_jar') || (project.property('generate_sources_jar') as boolean)) {
        withSourcesJar()
    }
}

configurations {
    embed
    implementation.extendsFrom(embed)
}

minecraft {
    mcVersion.set('1.12.2')

    mcpMappingChannel.set(project.hasProperty('mapping_channel') ? project.property('mapping_channel') as String : 'stable')
    mcpMappingVersion.set(project.hasProperty('mapping_version') ? project.property('mapping_version') as String : '39')

    useDependencyAccessTransformers.set(!project.hasProperty('use_dependency_at_files') || (project.property('use_dependency_at_files') as boolean))
    
    

    
}

repositories {
    maven {
        name 'CleanroomMC Maven'
        url 'https://maven.cleanroommc.com'
    }
    exclusiveContent {
        forRepository {
            maven {
                name 'CurseMaven'
                url 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name 'Modrinth'
                url 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    mavenLocal()
}

dependencies {
    implementation rfg.deobf('curse.maven:had-enough-items-557549:4543375')

    if(project.hasProperty('realistic_item_drops') && (project.property('realistic_item_drops') as boolean)) {
        implementation rfg.deobf("curse.maven:realistic-item-drops-245620:2630384")
    } else {
        compileOnly rfg.deobf("curse.maven:realistic-item-drops-245620:2630384")
    }

    if (project.hasProperty('use_asset_mover') && (project.property('use_asset_mover') as boolean)) {
        implementation "com.cleanroommc:assetmover:${project.property('asset_mover_version')}"
    }
    if (project.hasProperty('enable_junit_testing') && (project.property('enable_junit_testing') as boolean)) {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

// Access Transformer
if (project.hasProperty('use_access_transformer') && (project.property('use_access_transformer') as boolean)) {
    def atLocations = project.hasProperty('access_transformer_locations') ? (project.property('access_transformer_locations') as String) : "${modId}_at.cfg"
    atLocations = atLocations.replace('${mod_id}', modId)
    
    def locations = atLocations.split(' ').findAll { !it.isEmpty() }
    for (def location : locations) {
        def fileLocation = file("${projectDir}/src/main/resources/${location}")
        if (fileLocation.exists()) {
            tasks.deobfuscateMergedJarToSrg.accessTransformerFiles.from(fileLocation)
            tasks.srgifyBinpatchedJar.accessTransformerFiles.from(fileLocation)
        } else {
            logger.warn("Access Transformer file [$fileLocation] does not exist, skipping...")
        }
    }
}

processResources {
    def filterList = ['mcmod.info', 'pack.mcmeta']

    filesMatching(filterList) { fcd ->
        fcd.expand(
            'mod_id': modId,
            'mod_name': project.findProperty('mod_name') ?: 'Example Mod',
            'mod_version': modVersion,
            'mod_description': project.findProperty('mod_description') ?: '',
            'mod_authors': project.hasProperty('mod_authors') ? "[${(project.property('mod_authors') as String).split(',').collect { it.trim() }.join(', ')}]" : '[]',
            'mod_credits': project.findProperty('mod_credits') ?: '',
            'mod_url': project.findProperty('mod_url') ?: '',
            'mod_update_json': project.findProperty('mod_update_json') ?: '',
            'mod_logo_path': project.findProperty('mod_logo_path') ?: ''
        )
    }
    
    if (project.hasProperty('use_access_transformer') && (project.property('use_access_transformer') as boolean)) {
        rename '(.+_at.cfg)', 'META-INF/$1'
    }
}

jar {
    manifest {
        def attribute_map = [:]
        if (project.hasProperty('use_access_transformer') && (project.property('use_access_transformer') as boolean)) {
            def atLocations = project.hasProperty('access_transformer_locations') ? (project.property('access_transformer_locations') as String) : "${modId}_at.cfg"
            atLocations = atLocations.replace('${mod_id}', modId)
            attribute_map['FMLAT'] = atLocations
        }
        attributes(attribute_map)
    }
    from(provider{ configurations.embed.collect { it.isDirectory() ? it : zipTree(it) } })
}

test {
    useJUnitPlatform()
    if (project.hasProperty('show_testing_output') && (project.property('show_testing_output') as boolean)) {
        testLogging {
            showStandardStreams = true
        }
    }
}

tasks.register('cleanroomAfterSync') {
    group 'cleanroom helpers'
}

tasks.named('prepareObfModsFolder').configure {
    finalizedBy 'prioritizeCoremods'
}

tasks.register('prioritizeCoremods') {
    dependsOn 'prepareObfModsFolder'
    doLast {
        fileTree('run/obfuscated').forEach {
            if (it.isFile() && it.name =~ '(mixinbooter|configanytime)(-)([0-9])+\\.+([0-9])+(.jar)') {
                it.renameTo(new File(it.parentFile, "!${it.name}"))
            }
        }
    }
}
