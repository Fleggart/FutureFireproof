/**
 * It is advised that you do not edit anything in the build.gradle; unless you are sure of what you are doing
 */
import com.gtnewhorizons.retrofuturagradle.mcp.InjectTagsTask
import org.jetbrains.changelog.Changelog
import org.jetbrains.gradle.ext.Gradle

plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.7'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
    id 'org.jetbrains.changelog' version '2.2.0'
}

// 读取 gradle.properties 中的值
def modVersion = project.findProperty('mod_version') ?: '1.0.0'
def rootPackage = project.findProperty('root_package') ?: 'com.example'
def modId = project.findProperty('mod_id') ?: 'examplemod'

version = modVersion
group = rootPackage

base {
    archivesName.set(modId)
}

// 兼容 Gradle 9.2.1 - 使用字符串而不是枚举
java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
        // 移除 vendor 设置，避免 JvmVendorSpec.IBM_SEMERU 问题
        // vendor.set(JvmVendorSpec.AZUL)
    }
    if (!project.hasProperty('generate_sources_jar') || (project.property('generate_sources_jar') as boolean)) {
        withSourcesJar()
    }
    if (project.hasProperty('generate_javadocs_jar') && (project.property('generate_javadocs_jar') as boolean)) {
        withJavadocJar()
    }
}

configurations {
    embed
    implementation.extendsFrom(embed)
}

minecraft {
    mcVersion.set('1.12.2')

    mcpMappingChannel.set(project.hasProperty('mapping_channel') ? project.property('mapping_channel') as String : 'stable')
    mcpMappingVersion.set(project.hasProperty('mapping_version') ? project.property('mapping_version') as String : '39')

    useDependencyAccessTransformers.set(!project.hasProperty('use_dependency_at_files') || (project.property('use_dependency_at_files') as boolean))

    username.set(project.hasProperty('minecraft_username') ? project.property('minecraft_username') as String : 'Developer')
    
    if (project.hasProperty('extra_tweak_classes') && !(project.property('extra_tweak_classes') as String).isEmpty()) {
        extraTweakClasses.addAll((project.property('extra_tweak_classes') as String).split(' '))
    }

    def args = ['-ea:' + group]
    if (project.hasProperty('use_mixins') && (project.property('use_mixins') as boolean)) {
        args << '-Dmixin.hotSwap=true'
        args << '-Dmixin.checks.interfaces=true'
        args << '-Dmixin.debug.export=true'
    }
    extraRunJvmArguments.addAll(args)
    if (project.hasProperty('extra_jvm_args') && !(project.property('extra_jvm_args') as String).isEmpty()) {
        extraRunJvmArguments.addAll((project.property('extra_jvm_args') as String).split(' '))
    }

    if (project.hasProperty('use_tags') && (project.property('use_tags') as boolean)) {
        if (file('tags.properties').exists()) {
            Properties props = new Properties().tap { it.load(file('tags.properties').newInputStream()); it }
            if (!props.isEmpty()) {
                injectedTags.set(props.collectEntries { k, v -> [(k): v] })
            }
        }
    }
}

repositories {
    maven {
        name 'CleanroomMC Maven'
        url 'https://maven.cleanroommc.com'
    }
}

dependencies {
    if (project.hasProperty('use_modern_java_syntax') && (project.property('use_modern_java_syntax') as boolean)) {
        annotationProcessor 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.0'
        annotationProcessor 'net.java.dev.jna:jna-platform:5.13.0'
        compileOnly 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.0' {
            transitive = false
        }
        patchedMinecraft 'me.eigenraven.java8unsupported:java-8-unsupported-shim:1.0.0'
        testAnnotationProcessor 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.0'
        testCompileOnly 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.0' {
            transitive = false
        }
    }
    if (project.hasProperty('use_asset_mover') && (project.property('use_asset_mover') as boolean)) {
        implementation "com.cleanroommc:assetmover:${project.property('asset_mover_version')}"
    }
    if (project.hasProperty('use_mixins') && (project.property('use_mixins') as boolean)) {
        String mixin = modUtils.enableMixins("zone.rong:mixinbooter:${project.property('mixin_booter_version')}", project.property('mixin_refmap') as String)
        api(mixin) {
            transitive = false
        }
        annotationProcessor 'org.ow2.asm:asm-debug-all:5.2'
        annotationProcessor 'com.google.guava:guava:24.1.1-jre'
        annotationProcessor 'com.google.code.gson:gson:2.8.6'
        annotationProcessor(mixin) {
            transitive = false
        }
    }
    if (project.hasProperty('enable_junit_testing') && (project.property('enable_junit_testing') as boolean)) {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

apply from: 'gradle/scripts/dependencies.gradle'

// Access Transformer - 修复路径问题
if (project.hasProperty('use_access_transformer') && (project.property('use_access_transformer') as boolean)) {
    def atLocations = project.hasProperty('access_transformer_locations') ? (project.property('access_transformer_locations') as String) : "${modId}_at.cfg"
    // 替换 ${mod_id} 变量
    atLocations = atLocations.replace('${mod_id}', modId)
    
    def locations = atLocations.split(' ').findAll { !it.isEmpty() }
    for (def location : locations) {
        def fileLocation = file("${projectDir}/src/main/resources/${location}")
        if (fileLocation.exists()) {
            tasks.deobfuscateMergedJarToSrg.accessTransformerFiles.from(fileLocation)
            tasks.srgifyBinpatchedJar.accessTransformerFiles.from(fileLocation)
        } else {
            // 如果文件不存在，给出警告而不是失败（因为可能不需要 AT）
            logger.warn("Access Transformer file [$fileLocation] does not exist, skipping...")
            // throw new GradleException("Access Transformer file [$fileLocation] does not exist!")
        }
    }
}

processResources {
    def filterList = ['mcmod.info', 'pack.mcmeta']
    if (project.hasProperty('mixin_configs')) {
        filterList.addAll((project.property('mixin_configs') as String).split(' ').collect(config -> "mixins.${config}.json" as String))
    }

    filesMatching(filterList) { fcd ->
        fcd.expand(
            'mod_id': modId,
            'mod_name': project.findProperty('mod_name') ?: 'Example Mod',
            'mod_version': modVersion,
            'mod_description': project.findProperty('mod_description') ?: '',
            'mod_authors': project.hasProperty('mod_authors') ? "[${(project.property('mod_authors') as String).split(',').collect { it.trim() }.join(', ')}]" : '[]',
            'mod_credits': project.findProperty('mod_credits') ?: '',
            'mod_url': project.findProperty('mod_url') ?: '',
            'mod_update_json': project.findProperty('mod_update_json') ?: '',
            'mod_logo_path': project.findProperty('mod_logo_path') ?: '',
            'mixin_refmap': project.findProperty('mixin_refmap') ?: '',
            'mixin_package': project.findProperty('mixin_package') ?: ''
        )
    }
    
    if (project.hasProperty('use_access_transformer') && (project.property('use_access_transformer') as boolean)) {
        rename '(.+_at.cfg)', 'META-INF/$1'
    }
}

jar {
    manifest {
        def attribute_map = [:]
        if (project.hasProperty('is_coremod') && (project.property('is_coremod') as boolean)) {
            attribute_map['FMLCorePlugin'] = project.property('coremod_plugin_class_name') as String
            if (!project.hasProperty('coremod_includes_mod') || (project.property('coremod_includes_mod') as boolean)) {
                attribute_map['FMLCorePluginContainsFMLMod'] = true
                def currentTasks = gradle.startParameter.taskNames
                if (currentTasks[0] == 'build' || currentTasks[0] == 'prepareObfModsFolder' || currentTasks[0] == 'runObfClient') {
                    attribute_map['ForceLoadAsMod'] = true
                }
            }
        }
        if (project.hasProperty('use_access_transformer') && (project.property('use_access_transformer') as boolean)) {
            def atLocations = project.hasProperty('access_transformer_locations') ? (project.property('access_transformer_locations') as String) : "${modId}_at.cfg"
            atLocations = atLocations.replace('${mod_id}', modId)
            attribute_map['FMLAT'] = atLocations
        }
        attributes(attribute_map)
    }
    from(provider{ configurations.embed.collect { it.isDirectory() ? it : zipTree(it) } })
}

idea {
    module {
        inheritOutputDirs = true
    }
    project {
        settings {
            runConfigurations {
                "1. Run Client"(Gradle) {
                    taskNames = ["runClient"]
                }
                "2. Run Server"(Gradle) {
                    taskNames = ["runServer"]
                }
                "3. Run Obfuscated Client"(Gradle) {
                    taskNames = ["runObfClient"]
                }
                "4. Run Obfuscated Server"(Gradle) {
                    taskNames = ["runObfServer"]
                }
            }
            compiler.javac {
                afterEvaluate {
                    javacAdditionalOptions = "-encoding utf8"
                    moduleJavacAdditionalOptions = [
                        (project.name + ".main"): tasks.compileJava.options.compilerArgs.collect { '"' + it + '"' }.join(' ')
                    ]
                }
            }
        }
    }
}

compileTestJava {
    sourceCompatibility = targetCompatibility = 8
}

test {
    useJUnitPlatform()
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    })
    if (project.hasProperty('show_testing_output') && (project.property('show_testing_output') as boolean)) {
        testLogging {
            showStandardStreams = true
        }
    }
}

String parserChangelog() {
    if (!file('CHANGELOG.md').exists()) {
        throw new GradleException('publish_with_changelog is true, but CHANGELOG.md does not exist in the workspace!')
    }
    String parsedChangelog = changelog.renderItem(
        changelog.get(modVersion).withHeader(false).withEmptySections(false),
        Changelog.OutputType.MARKDOWN)
    if (parsedChangelog.isEmpty()) {
        throw new GradleException('publish_with_changelog is true, but the changelog for the latest version is empty!')
    }
    return parsedChangelog
}

tasks.register('generateMixinJson') {
    group 'cleanroom helpers'
    def missingConfig = []
    if (project.hasProperty('mixin_configs')) {
        missingConfig = (project.property('mixin_configs') as String).split(' ').findAll(config -> !file("src/main/resources/mixins.${config}.json").exists())
    }
    onlyIf {
        if (project.hasProperty('use_mixins') && (project.property('use_mixins') as boolean) && 
            project.hasProperty('generate_mixins_json') && (project.property('generate_mixins_json') as boolean)) {
            return !missingConfig.empty
        }
        return false
    }
    doLast {
        for (String mixinConfig : missingConfig) {
            def file = file("src/main/resources/mixins.${mixinConfig}.json")
            file << """{\n\t"package": "",\n\t"required": true,\n\t"refmap": "${project.findProperty('mixin_refmap') ?: ''}",\n\t"target": "@env(DEFAULT)",\n\t"minVersion": "0.8.5",\n\t"compatibilityLevel": "JAVA_8",\n\t"mixins": [],\n\t"server": [],\n\t"client": []\n}"""
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (project.hasProperty('use_modern_java_syntax') && (project.property('use_modern_java_syntax') as boolean)) {
        if (it.name in ['compileMcLauncherJava', 'compilePatchedMcJava']) {
            return
        }
        sourceCompatibility = 17
        options.release.set(8)
        javaCompiler.set(javaToolchains.compilerFor {
            languageVersion.set(JavaLanguageVersion.of(16))
            // 移除 vendor 设置
            // vendor.set(JvmVendorSpec.AZUL)
        })
    }
}

tasks.register('cleanroomAfterSync') {
    group 'cleanroom helpers'
    dependsOn 'injectTags', 'generateMixinJson'
}

if (project.hasProperty('use_modern_java_syntax') && (project.property('use_modern_java_syntax') as boolean)) {
    tasks.withType(Javadoc).configureEach {
        sourceCompatibility = 17
    }
}

tasks.named('injectTags', InjectTagsTask).configure {
    onlyIf {
        return project.hasProperty('use_tags') && (project.property('use_tags') as boolean) && !it.getTags().get().isEmpty()
    }
    it.outputClassName.set(project.hasProperty('tag_class_name') ? project.property('tag_class_name') as String : '')
}

tasks.named('prepareObfModsFolder').configure {
    finalizedBy 'prioritizeCoremods'
}

tasks.register('prioritizeCoremods') {
    dependsOn 'prepareObfModsFolder'
    doLast {
        fileTree('run/obfuscated').forEach {
            if (it.isFile() && it.name =~ '(mixinbooter|configanytime)(-)([0-9])+\\.+([0-9])+(.jar)') {
                it.renameTo(new File(it.parentFile, "!${it.name}"))
            }
        }
    }
}

idea.project.settings {
    taskTriggers {
        afterSync 'cleanroomAfterSync'
    }
}

// Publishing 相关已移除
// apply from: 'gradle/scripts/publishing.gradle'
apply from: 'gradle/scripts/extra.gradle'
